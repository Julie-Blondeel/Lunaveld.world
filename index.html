<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lunaveld_world</title>
    <link rel = "stylesheet"href="style.css" /> 
</head>

<body>
    <main class="page">

        <div class="map-viewer" id="mapViewer">
        <div class="map-layer" id="mapLayer">
            <img 
            src="./images/Lunaveld.png" 
            alt="Lunaveld" 
            class="map-image" 
            id="mapImage"
            />

        <p id="popupText"></p>
</div>
</div>
</div>

    </main>

    <script
    src="https://unpkg.com/@panzoom/panzoom/dist/panzoom.min.js"></script>
    <script src="script.js"></script>
